name: India Macro Release Sync

on:
  schedule:
    # 19:00 IST, after the usual government-release window; every calendar day.
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: india-macro-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
      - name: Sync official India releases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node backend/indiaMacro/ingest.js --force
