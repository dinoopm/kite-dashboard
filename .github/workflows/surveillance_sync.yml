name: Surveillance Data Sync

on:
  schedule:
    # Run at 00:00 UTC (5:30 AM IST) every Saturday (weekly refresh)
    - cron: '0 0 * * 6'
  workflow_dispatch: # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 22, not 20: @supabase/supabase-js 2.112+ declares node >=22 and its
          # realtime client throws at createClient() on 20 ("native WebSocket
          # not found" — WebSocket only became a global in Node 22). Every
          # scraper here opens a Supabase client on its first line, so on 20
          # the whole workflow dies before it fetches anything.
          node-version: '22'
          cache: 'npm'
          
      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd backend && (npm ci || npm install)

      - name: Run Surveillance Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node backend/scraper/surveillance.js
