name: Macro Data Sync

# The dashboard's daily job (backend/dailyJobs.js) only runs while the server
# is up, which for a locally-run backend means "while the laptop is on". This
# keeps macro_observations current regardless.
#
# BLS and BEA publish at 08:30 ET, which is 12:30 UTC in summer and 13:30 UTC
# in winter — and FRED needs time to ingest after that. A single 12:30 UTC run
# therefore fired AT the release in summer and an hour BEFORE it in winter, so
# a release-day print would not have landed until the following day.
#
# Two runs instead: 15:00 UTC catches the morning release once FRED has it
# under either offset, and 20:00 UTC catches anything late plus the daily oil
# and breakeven updates.
on:
  schedule:
    - cron: '0 15,20 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'recent (rolling 30 months) or backfill (from 2000)'
        required: false
        default: 'recent'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 22, not 20: @supabase/supabase-js 2.112+ declares node >=22 and its
          # realtime client throws at createClient() on 20 ("native WebSocket
          # not found" — WebSocket only became a global in Node 22). Every
          # scraper here opens a Supabase client on its first line, so on 20
          # the whole workflow dies before it fetches anything.
          node-version: '22'
          cache: 'npm'

      # BOTH installs are required, and the root one is not optional padding:
      # @supabase/supabase-js is declared in the ROOT package.json, not in
      # backend/package.json, so `require('@supabase/supabase-js')` from a
      # backend script resolves by walking up to the root node_modules. Install
      # only backend and every backend script that touches the database dies at
      # module load. That is what failed run #1 in under a second. The other two
      # workflows have always done both, which is why they were unaffected.
      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd backend && (npm ci || npm install)

      # FRED_API_KEY is optional: without it the keyless CSV endpoint is used,
      # which carries the same observations but no vintage history.
      - name: Ingest macro series
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: cd backend && node macro/ingest.js ${{ github.event.inputs.mode || 'recent' }}
